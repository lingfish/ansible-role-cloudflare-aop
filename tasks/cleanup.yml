---
# tasks/cleanup.yml - Delete old/expired certificates
#
# Removes old certificates from Cloudflare that are no longer needed.
# Only deletes certificates that are not the currently active one.

- name: List all certificates
  ansible.builtin.uri:
    url: "{{ cloudflare_aop_api_base }}{{ cloudflare_aop_cert_endpoint }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: 200
  register: _all_certs
  changed_when: false

- name: Delete old certificates
  ansible.builtin.uri:
    url: >-
      {{ cloudflare_aop_api_base }}{{ cloudflare_aop_cert_endpoint }}/{{ item.id }}
    method: DELETE
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: 200
  loop: "{{ _all_certs.json.result | default([]) }}"
  loop_control:
    label: "{{ item.id }} (expires: {{ item.expires_on }})"
  when:
    - _upload_result is defined
    - _upload_result.json is defined
    - _upload_result.json.result is defined
    - item.id != _upload_result.json.result.id
  register: _delete_results

- name: Report cleanup results
  ansible.builtin.debug:
    msg: >-
      Deleted {{ _delete_results.results | selectattr('changed', 'true') | list | length }}
      old certificate(s).
  when: _delete_results is defined
