---
# tasks/cleanup_replaced_hostname.yml - Delete hostname certificates this run replaced
#
# Deletes the certificates that enable_hostname.yml moved our hostnames away
# from, once no hostname association in the zone references them any more.
# Unlike cleanup_hostname.yml, certificates the role did not replace are left alone.
# A failed delete only warns, since the new certificates are already in place.

- name: Delete replaced hostname certificates
  vars:
    __in_use: "{{ _hostname_verify.json.result | default([]) | map(attribute='cert_id', default='') | list }}"
  ansible.builtin.uri:
    url: >-
      {{ cloudflare_aop_api_base }}{{ cloudflare_aop_hostname_cert_endpoint }}/{{ item }}
    method: DELETE
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: [200, 202]
  loop: "{{ _hostname_replaced_ids | unique | reject('in', __in_use) | list }}"
  register: _hostname_replaced_delete
  changed_when: _hostname_replaced_delete.status | default(0) in [200, 202]
  failed_when: false

- name: Warn about replaced hostname certificates that could not be deleted
  ansible.builtin.debug:
    msg: >-
      [WARNING] Could not delete replaced hostname certificate {{ item.item }}:
      {{ item.json.errors | default(item.msg | default('unknown error')) }}
  loop: "{{ _hostname_replaced_delete.results | default([]) | rejectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"
