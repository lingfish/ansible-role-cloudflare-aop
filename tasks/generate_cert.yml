---
# tasks/generate_cert.yml - Generate CA and zone leaf certificates
#
# Creates a shared self-signed CA certificate (at the base cert dir)
# and a per-zone leaf certificate signed by that CA.
# The leaf certificate is what gets uploaded to Cloudflare for zone-level AOP.
# The CA certificate is what you install on your origin server.
#
# Supports automatic renewal: if a cert exists but is within
# cloudflare_aop_renew_days of expiry (or already expired),
# it will be regenerated and re-uploaded.

# ── Check existing state for CA ─────────────────────────────────────

- name: Check if CA certificate already exists
  ansible.builtin.stat:
    path: "{{ cloudflare_aop_ca_cert_path }}"
  register: _ca_cert

- name: Check if CA key already exists
  ansible.builtin.stat:
    path: "{{ cloudflare_aop_ca_key_path }}"
  register: _ca_key

- name: Check if CA CSR already exists
  ansible.builtin.stat:
    path: "{{ cloudflare_aop_ca_csr_path }}"
  register: _ca_csr_file

# ── Check expiry via valid_at (only when cert exists) ────────────────

- name: Check CA certificate expiry
  community.crypto.x509_certificate_info:
    path: "{{ cloudflare_aop_ca_cert_path }}"
    valid_at:
      renew_threshold: "+{{ cloudflare_aop_renew_days }}d"
  register: _ca_check
  when: _ca_cert.stat.exists

# ── Determine renewal need ───────────────────────────────────────────

- name: Set CA renewal fact
  ansible.builtin.set_fact:
    _ca_needs_renew: >-
      {{ (not _ca_cert.stat.exists)
         or (_ca_cert.stat.exists and not _ca_check.valid_at.renew_threshold) }}

# ── CA key ───────────────────────────────────────────────────────────

- name: Generate CA private key (RSA)
  community.crypto.openssl_privatekey:
    path: "{{ cloudflare_aop_ca_key_path }}"
    type: RSA
    size: "{{ cloudflare_aop_key_size }}"
    force: "{{ _ca_key.stat.exists and _ca_needs_renew | bool }}"
    mode: "0600"
  when:
    - not _ca_key.stat.exists or (_ca_needs_renew | bool and _ca_key.stat.exists)
    - cloudflare_aop_key_type == "rsa"

- name: Generate CA private key (ECC)
  community.crypto.openssl_privatekey:
    path: "{{ cloudflare_aop_ca_key_path }}"
    type: ECC
    curve: "{{ cloudflare_aop_ecc_curve }}"
    force: "{{ _ca_key.stat.exists and _ca_needs_renew | bool }}"
    mode: "0600"
  when:
    - not _ca_key.stat.exists or (_ca_needs_renew | bool and _ca_key.stat.exists)
    - cloudflare_aop_key_type == "ecc"

# ── CA cert ──────────────────────────────────────────────────────────

- name: Generate CA CSR
  community.crypto.openssl_csr:
    path: "{{ cloudflare_aop_ca_csr_path }}"
    privatekey_path: "{{ cloudflare_aop_ca_key_path }}"
    common_name: "{{ cloudflare_aop_ca_common_name }}"
    use_common_name_for_san: false
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
    key_usage_critical: true
    force: "{{ _ca_csr_file.stat.exists and _ca_needs_renew | bool }}"
    mode: "0644"
  when:
    - not _ca_csr_file.stat.exists or (_ca_needs_renew | bool and _ca_csr_file.stat.exists)

- name: Read CA CSR content
  ansible.builtin.slurp:
    src: "{{ cloudflare_aop_ca_csr_path }}"
  register: _ca_csr_content

- name: Self-sign CA certificate
  community.crypto.x509_certificate:
    path: "{{ cloudflare_aop_ca_cert_path }}"
    csr_content: "{{ _ca_csr_content.content | b64decode }}"
    privatekey_path: "{{ cloudflare_aop_ca_key_path }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ cloudflare_aop_ca_validity }}d"
  when: _ca_needs_renew | bool
  notify: "cloudflare_aop ca changed"

# ── Zone leaf (delegated to generate_leaf.yml) ─────────────────────

- name: Generate zone leaf certificate
  ansible.builtin.include_tasks: generate_leaf.yml
  vars:
    __leaf_dir: "{{ cloudflare_aop_zone_cert_dir }}"
    __leaf_cn: "{{ cloudflare_aop_leaf_common_name }}"
  when: _aop_do_zone | default(true) | bool
