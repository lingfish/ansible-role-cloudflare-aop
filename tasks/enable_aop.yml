---
# tasks/enable_aop.yml - Enable zone-level Authenticated Origin Pulls
#
# Enables AOP for the zone if not already enabled.

- name: Enable zone-level AOP
  ansible.builtin.uri:
    url: "{{ cloudflare_aop_api_base }}{{ cloudflare_aop_settings_endpoint }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      enabled: true
    status_code: [200, 202]
  register: _enable_result
  notify: "cloudflare_aop cloudflare changed"

- name: Verify AOP is enabled
  ansible.builtin.uri:
    url: "{{ cloudflare_aop_api_base }}{{ cloudflare_aop_settings_endpoint }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: [200, 202]
  register: _verify_settings
  changed_when: false

- name: Fail if AOP enablement failed
  ansible.builtin.fail:
    msg: >-
      Failed to enable zone-level AOP.
      Expected enabled=true, got enabled={{ _verify_settings.json.result.enabled }}.
  when: not _verify_settings.json.result.enabled | bool

- name: AOP enabled successfully
  ansible.builtin.debug:
    msg: "Zone-level Authenticated Origin Pulls is now enabled."
