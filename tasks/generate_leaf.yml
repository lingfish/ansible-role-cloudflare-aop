---
# tasks/generate_leaf.yml - Generate a single leaf certificate
#
# Expects vars:
#   __leaf_dir: directory for this leaf (e.g. {{ cloudflare_aop_zone_cert_dir }} or {{ cloudflare_aop_zone_cert_dir }}/{{ hostname }})
#   __leaf_cn: common name for the leaf
#   __leaf_hostname: (optional) hostname string — when set, accumulates into _hostname_certs dict
#
# The leaf is re-signed when it is missing or expiring, when leaf.key is
# missing or does not belong to leaf.pem, and when the CA was (or will be)
# re-issued or the leaf was not signed by the current CA.

# ── Check existing state ─────────────────────────────────────────────

- name: Check if leaf directory already exists
  ansible.builtin.stat:
    path: "{{ __leaf_dir }}"
  register: __leaf_dir_stat

- name: Check if leaf certificate already exists
  ansible.builtin.stat:
    path: "{{ __leaf_dir }}/leaf.pem"
  register: __leaf_cert_stat

- name: Check if leaf key already exists
  ansible.builtin.stat:
    path: "{{ __leaf_dir }}/leaf.key"
  register: __leaf_key_stat

- name: Check if leaf CSR already exists
  ansible.builtin.stat:
    path: "{{ __leaf_dir }}/leaf.csr"
  register: __leaf_csr_file

# ── Check expiry via valid_at (only when cert exists) ────────────────

- name: Check leaf certificate expiry
  community.crypto.x509_certificate_info:
    path: "{{ __leaf_dir }}/leaf.pem"
    valid_at:
      renew_threshold: "+{{ cloudflare_aop_renew_days }}d"
  register: __leaf_check
  when: __leaf_cert_stat.stat.exists

- name: Read leaf private key info
  community.crypto.openssl_privatekey_info:
    path: "{{ __leaf_dir }}/leaf.key"
  register: __leaf_key_info
  when:
    - __leaf_cert_stat.stat.exists
    - __leaf_key_stat.stat.exists

# ── Determine renewal need ───────────────────────────────────────────

- name: Set leaf renewal fact
  ansible.builtin.set_fact:
    __leaf_needs_renew: >-
      {{ (not __leaf_cert_stat.stat.exists)
         or (not __leaf_check.valid_at.renew_threshold)
         or (not __leaf_key_stat.stat.exists)
         or (__leaf_key_info.public_key != __leaf_check.public_key)
         or (_ca_needs_renew | default(false) | bool)
         or ((_ca_check.subject_key_identifier | default(none)) is not none
             and (__leaf_check.authority_key_identifier | default(none)) is not none
             and __leaf_check.authority_key_identifier != _ca_check.subject_key_identifier) }}

# ── Leaf key ─────────────────────────────────────────────────────────
# In check mode, steps whose input files would only be created by an
# earlier step are skipped.

- name: Generate leaf private key (RSA)
  community.crypto.openssl_privatekey:
    path: "{{ __leaf_dir }}/leaf.key"
    type: RSA
    size: "{{ cloudflare_aop_key_size }}"
    force: "{{ __leaf_key_stat.stat.exists and __leaf_needs_renew | bool }}"
    mode: "0600"
  when:
    - not __leaf_key_stat.stat.exists or (__leaf_needs_renew | bool and __leaf_key_stat.stat.exists)
    - cloudflare_aop_key_type == "rsa"
    - not ansible_check_mode or __leaf_dir_stat.stat.exists

- name: Generate leaf private key (ECC)
  community.crypto.openssl_privatekey:
    path: "{{ __leaf_dir }}/leaf.key"
    type: ECC
    curve: "{{ cloudflare_aop_ecc_curve }}"
    force: "{{ __leaf_key_stat.stat.exists and __leaf_needs_renew | bool }}"
    mode: "0600"
  when:
    - not __leaf_key_stat.stat.exists or (__leaf_needs_renew | bool and __leaf_key_stat.stat.exists)
    - cloudflare_aop_key_type == "ecc"
    - not ansible_check_mode or __leaf_dir_stat.stat.exists

# ── Leaf cert ────────────────────────────────────────────────────────

- name: Generate leaf CSR
  community.crypto.openssl_csr:
    path: "{{ __leaf_dir }}/leaf.csr"
    privatekey_path: "{{ __leaf_dir }}/leaf.key"
    common_name: "{{ __leaf_cn }}"
    force: "{{ __leaf_csr_file.stat.exists and __leaf_needs_renew | bool }}"
    mode: "0644"
  when:
    - not __leaf_csr_file.stat.exists or (__leaf_needs_renew | bool and __leaf_csr_file.stat.exists)
    - not ansible_check_mode or __leaf_key_stat.stat.exists

- name: Sign leaf certificate with CA
  community.crypto.x509_certificate:
    path: "{{ __leaf_dir }}/leaf.pem"
    csr_path: "{{ __leaf_dir }}/leaf.csr"
    provider: ownca
    ownca_path: "{{ cloudflare_aop_ca_cert_path }}"
    ownca_privatekey_path: "{{ cloudflare_aop_ca_key_path }}"
    ownca_not_after: "+{{ cloudflare_aop_leaf_validity }}d"
    force: true
  when:
    - __leaf_needs_renew | bool
    - not ansible_check_mode or (__leaf_csr_file.stat.exists and not _ca_needs_renew | default(false) | bool)

# ── Read cert content for upload ─────────────────────────────────────
# Skipped in check mode when the leaf would be re-issued: the files on
# disk are missing or stale, so there is nothing meaningful to upload.

- name: Set leaf readiness fact
  ansible.builtin.set_fact:
    __leaf_ready: "{{ not (ansible_check_mode and __leaf_needs_renew | bool) }}"

- name: Read leaf certificate for upload
  ansible.builtin.slurp:
    src: "{{ __leaf_dir }}/leaf.pem"
  register: __leaf_slurp_cert
  when: __leaf_ready | bool

- name: Read leaf private key for upload
  ansible.builtin.slurp:
    src: "{{ __leaf_dir }}/leaf.key"
  register: __leaf_slurp_key
  when: __leaf_ready | bool

- name: Accumulate hostname certificate
  ansible.builtin.set_fact:
    _hostname_certs: >-
      {{ (_hostname_certs | default({})) | combine({__leaf_hostname: {'cert_pem': __leaf_slurp_cert.content | b64decode, 'key_pem': __leaf_slurp_key.content | b64decode}}) }}
  when:
    - __leaf_hostname is defined
    - __leaf_ready | bool

- name: Set zone leaf certificate facts
  ansible.builtin.set_fact:
    _leaf_cert_pem: "{{ (__leaf_slurp_cert.content | b64decode) if __leaf_ready | bool else '' }}"
    _leaf_key_pem: "{{ (__leaf_slurp_key.content | b64decode) if __leaf_ready | bool else '' }}"
  when: __leaf_hostname is not defined
