---
# tasks/upload_cert.yml - Upload leaf certificate to Cloudflare
#
# Uploads the leaf certificate and private key to Cloudflare for use
# with zone-level Authenticated Origin Pulls.
# Skips the upload when the same certificate is already on Cloudflare.

- name: List existing certificates
  ansible.builtin.uri:
    url: "{{ cloudflare_aop_api_base }}{{ cloudflare_aop_cert_endpoint }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: [200, 202]
  register: _cert_list
  changed_when: false
  check_mode: false

- name: Read leaf certificate serial number
  community.crypto.x509_certificate_info:
    content: "{{ _leaf_cert_pem }}"
  register: _leaf_cert_info
  when: _leaf_cert_pem | default('') | length > 0

# Match on the certificate PEM (whitespace-insensitive), or the serial number
- name: Find existing certificate matching the leaf
  vars:
    __certs: "{{ _cert_list.json.result | default([]) }}"
    __pems: "{{ __certs | map(attribute='certificate', default='') | map('regex_replace', '\\s+', '') | list }}"
    __serials: "{{ __certs | map(attribute='serial_number', default='') | map('string') | list }}"
    __pem: "{{ _leaf_cert_pem | regex_replace('\\s+', '') }}"
    __serial: "{{ _leaf_cert_info.serial_number | string }}"
  ansible.builtin.set_fact:
    _existing_cert: >-
      {{ __certs[__pems.index(__pem)] if __pem in __pems
         else (__certs[__serials.index(__serial)] if __serial in __serials else {}) }}
  when: _leaf_cert_pem | default('') | length > 0

- name: Upload certificate to Cloudflare
  ansible.builtin.uri:
    url: "{{ cloudflare_aop_api_base }}{{ cloudflare_aop_cert_endpoint }}"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      certificate: "{{ _leaf_cert_pem }}"
      private_key: "{{ _leaf_key_pem }}"
    status_code: [200, 201, 202]
  register: _upload_result
  changed_when: true
  when:
    - _leaf_cert_pem | default('') | length > 0
    - _existing_cert.id is not defined
  notify: "cloudflare_aop cloudflare changed"

- name: Set cert ID from existing certificate
  ansible.builtin.set_fact:
    _upload_result:
      json:
        result:
          id: "{{ _existing_cert.id }}"
          status: "{{ _existing_cert.status | default('active') }}"
      success: true
  when:
    - _leaf_cert_pem | default('') | length > 0
    - _existing_cert.id is defined

- name: Wait for certificate to become active
  ansible.builtin.uri:
    url: >-
      {{ cloudflare_aop_api_base }}{{ cloudflare_aop_cert_endpoint }}/{{ _upload_result.json.result.id }}
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: [200, 202]
  register: _cert_status
  changed_when: false
  until: _cert_status.json.result.status == "active"
  retries: 30
  delay: 10
  when:
    - _upload_result is defined
    - _upload_result.json.result is defined
    - _upload_result.json.result.id | length > 0

- name: Certificate ready
  ansible.builtin.debug:
    msg: >-
      Certificate {{ _upload_result.json.result.id }}
      (status: {{ _cert_status.json.result.status | default(_upload_result.json.result.status | default('unknown')) }})
  when: _upload_result.json.result.id is defined
