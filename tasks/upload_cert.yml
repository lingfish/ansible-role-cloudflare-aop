---
# tasks/upload_cert.yml - Upload leaf certificate to Cloudflare
#
# Uploads the leaf certificate and private key to Cloudflare for use
# with zone-level Authenticated Origin Pulls.
# Handles the case where the certificate already exists.

- name: List existing certificates
  ansible.builtin.uri:
    url: "{{ cloudflare_aop_api_base }}{{ cloudflare_aop_cert_endpoint }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: [200, 202]
  register: _cert_list
  changed_when: false

- name: Read leaf certificate serial number
  community.crypto.x509_certificate_info:
    content: "{{ _leaf_cert_pem }}"
  register: _leaf_cert_info
  when: _leaf_cert_pem is defined

- name: Find existing certificate with matching serial
  ansible.builtin.set_fact:
    _existing_cert: >-
      {{ _cert_list.json.result | default([]) | selectattr('serial_number', 'equalto', _leaf_cert_info.subject.serialNumber | default('')) | first | default({}) }}
  when:
    - _leaf_cert_pem is defined
    - _leaf_cert_info.subject is defined

- name: Upload certificate to Cloudflare
  ansible.builtin.uri:
    url: "{{ cloudflare_aop_api_base }}{{ cloudflare_aop_cert_endpoint }}"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      certificate: "{{ _leaf_cert_pem }}"
      private_key: "{{ _leaf_key_pem }}"
    status_code: [200, 201, 202, 400]
  register: _upload_result
  when:
    - _leaf_cert_pem is defined
    - _existing_cert.id is not defined
  notify: "cloudflare_aop cloudflare changed"

- name: Set cert ID from existing certificate
  ansible.builtin.set_fact:
    _upload_result:
      json:
        result:
          id: "{{ _existing_cert.id }}"
          status: "active"
      success: true
  when:
    - _existing_cert is defined
    - _existing_cert.id is defined

- name: Fail if upload failed with unexpected error
  ansible.builtin.fail:
    msg: >-
      Certificate upload failed.
      API response: {{ _upload_result.json.errors | default('unknown error') }}
  when:
    - _upload_result is defined
    - _upload_result.status | default(200) == 400
    - _upload_result.json.errors | default([]) | selectattr('code', 'equalto', 1406) | list | length == 0

- name: Handle already exists error - find existing cert
  when:
    - _upload_result is defined
    - _upload_result.status | default(200) == 400
    - _upload_result.json.errors | default([]) | selectattr('code', 'equalto', 1406) | list | length > 0
  block:
    - name: Find existing cert after already-exists error
      ansible.builtin.set_fact:
        _existing_cert_id: "{{ (_cert_list.json.result | first).id | default('') }}"

    - name: Set upload result from existing cert
      ansible.builtin.set_fact:
        _upload_result:
          json:
            result:
              id: "{{ _existing_cert_id }}"
              status: "active"
          success: true

- name: Wait for certificate to become active
  ansible.builtin.uri:
    url: >-
      {{ cloudflare_aop_api_base }}{{ cloudflare_aop_cert_endpoint }}/{{ _upload_result.json.result.id }}
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: [200, 202]
  register: _cert_status
  changed_when: false
  until: _cert_status.json.result.status == "active"
  retries: 30
  delay: 10
  when:
    - _upload_result is defined
    - _upload_result.json.result is defined
    - _upload_result.json.result.id | length > 0

- name: Certificate ready
  ansible.builtin.debug:
    msg: >-
      Certificate {{ _upload_result.json.result.id }}
      (status: {{ _cert_status.json.result.status | default(_upload_result.json.result.status | default('unknown')) }})
