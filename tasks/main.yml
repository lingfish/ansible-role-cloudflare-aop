---
# tasks/main.yml - Main entry point for cloudflare_aop role
#
# Flow:
# 1. Validate required variables
# 2. Fetch zone name from Cloudflare API
# 3. Check current AOP status (if enabling)
# 4. Generate CA + leaf certificates (optional)
# 5. Upload leaf certificate to Cloudflare (optional)
# 6. Enable zone-level AOP (optional)
# 7. Clean up old certificates (optional)
# 8. Read CA cert info + set return facts

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - cloudflare_aop_zone_id | length > 0
      - cloudflare_aop_api_token | length > 0
    fail_msg: >-
      Both cloudflare_aop_zone_id and cloudflare_aop_api_token must be set.
      See defaults/main.yml for details.
    success_msg: Required variables are set.
  tags:
    - cloudflare_aop

- name: Fetch zone name from Cloudflare API
  ansible.builtin.uri:
    url: "{{ cloudflare_aop_api_base }}{{ cloudflare_aop_zone_endpoint }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: [200]
  register: _zone_info
  changed_when: false
  failed_when: false
  when: cloudflare_aop_zone_name | default('') | length == 0
  tags:
    - cloudflare_aop

- name: Set zone name fact
  ansible.builtin.set_fact:
    cloudflare_aop_zone_name: >-
      {{ _zone_info.json.result.name | default(cloudflare_aop_zone_id) }}
  when: cloudflare_aop_zone_name | default('') | length == 0

- name: Ensure base cert directory exists
  ansible.builtin.file:
    path: "{{ cloudflare_aop_cert_dir }}"
    state: directory
    mode: "0700"
  when: cloudflare_aop_generate_cert | bool
  tags:
    - cloudflare_aop
    - cloudflare_aop_generate

- name: Ensure per-zone cert directory exists
  ansible.builtin.file:
    path: "{{ cloudflare_aop_zone_cert_dir }}"
    state: directory
    mode: "0700"
  when: cloudflare_aop_generate_cert | bool
  tags:
    - cloudflare_aop
    - cloudflare_aop_generate

- name: Check current AOP settings
  ansible.builtin.uri:
    url: "{{ cloudflare_aop_api_base }}{{ cloudflare_aop_settings_endpoint }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_aop_api_token }}"
      Content-Type: "application/json"
    status_code: [200, 202]
  register: _aop_settings
  changed_when: false
  when:
    - cloudflare_aop_upload_cert | bool or cloudflare_aop_enable | bool
  tags:
    - cloudflare_aop

- name: Set AOP status fact
  ansible.builtin.set_fact:
    _aop_enabled: "{{ _aop_settings.json.result.enabled | default(false) }}"
  when: _aop_settings is defined and _aop_settings is not changed

- name: Generate certificates
  ansible.builtin.include_tasks: generate_cert.yml
  when: cloudflare_aop_generate_cert | bool
  tags:
    - cloudflare_aop
    - cloudflare_aop_generate

- name: Upload certificate to Cloudflare
  ansible.builtin.include_tasks: upload_cert.yml
  when: cloudflare_aop_upload_cert | bool
  tags:
    - cloudflare_aop
    - cloudflare_aop_upload

- name: Enable zone-level AOP
  ansible.builtin.include_tasks: enable_aop.yml
  when:
    - cloudflare_aop_enable | bool
    - not (_aop_enabled | default(false) | bool)
  tags:
    - cloudflare_aop
    - cloudflare_aop_enable

- name: Clean up old certificates
  ansible.builtin.include_tasks: cleanup.yml
  when:
    - cloudflare_aop_cleanup_old | bool
    - _upload_result is defined
    - _upload_result.json is defined
  tags:
    - cloudflare_aop
    - cloudflare_aop_cleanup

- name: Read CA certificate info
  community.crypto.x509_certificate_info:
    path: "{{ cloudflare_aop_ca_cert_path }}"
  register: _ca_cert_info
  when: cloudflare_aop_generate_cert | bool
  tags:
    - cloudflare_aop

- name: Set role return facts
  ansible.builtin.set_fact:
    cloudflare_aop:
      zone_name: "{{ cloudflare_aop_zone_name }}"
      ca_cert_path: "{{ cloudflare_aop_ca_cert_path }}"
      ca_serial_number: "{{ _ca_cert_info.serial_number | default('') }}"
      ca_fingerprint: "{{ _ca_cert_info.fingerprints.sha256 | default('') }}"
      leaf_cert_path: "{{ cloudflare_aop_zone_cert_dir }}/leaf.pem"
      leaf_key_path: "{{ cloudflare_aop_zone_cert_dir }}/leaf.key"
      certificate_id: "{{ _upload_result.json.result.id | default('') }}"
      status: "{{ _upload_result.json.result.status | default('unknown') }}"
      enabled: "{{ _aop_enabled | default(false) }}"
      expires_on: "{{ _upload_result.json.result.expires_on | default('unknown') }}"
  tags:
    - cloudflare_aop
