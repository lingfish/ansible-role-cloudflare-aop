---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install python3 and cryptography library
      ansible.builtin.raw: |
        if command -v apt-get > /dev/null 2>&1; then
          apt-get update && apt-get install -y python3 python3-cryptography
        elif command -v dnf > /dev/null 2>&1; then
          dnf install -y python3 python3-cryptography
        elif command -v yum > /dev/null 2>&1; then
          yum install -y python3 python3-cryptography
        fi
      changed_when: false
