---
- name: Verify
  hosts: all
  tasks:
    - name: Check CA certificate exists
      ansible.builtin.stat:
        path: /etc/cloudflare/aop/ca.pem
      register: ca_cert

    - name: Assert CA certificate exists
      ansible.builtin.assert:
        that:
          - ca_cert.stat.exists
          - ca_cert.stat.size > 0
        fail_msg: CA certificate not found or empty

    - name: Check leaf certificate exists
      ansible.builtin.stat:
        path: /etc/cloudflare/aop/test_zone_id_12345/leaf.pem
      register: leaf_cert

    - name: Assert leaf certificate exists
      ansible.builtin.assert:
        that:
          - leaf_cert.stat.exists
          - leaf_cert.stat.size > 0
        fail_msg: Leaf certificate not found or empty

    - name: Check leaf private key exists
      ansible.builtin.stat:
        path: /etc/cloudflare/aop/test_zone_id_12345/leaf.key
      register: leaf_key

    - name: Assert leaf private key exists
      ansible.builtin.assert:
        that:
          - leaf_key.stat.exists
          - leaf_key.stat.size > 0
        fail_msg: Leaf private key not found or empty

    - name: Verify CA certificate properties
      community.crypto.x509_certificate_info:
        path: /etc/cloudflare/aop/ca.pem
      register: ca_info

    - name: Assert CA certificate is self-signed
      ansible.builtin.assert:
        that:
          - ca_info.subject.commonName == "Cloudflare AOP CA"
          - ca_info.basic_constraints | select("match", "CA:TRUE") | list | length > 0
        fail_msg: CA certificate has unexpected properties

    - name: Verify leaf certificate properties
      community.crypto.x509_certificate_info:
        path: /etc/cloudflare/aop/test_zone_id_12345/leaf.pem
      register: leaf_info

    - name: Assert leaf certificate properties
      ansible.builtin.assert:
        that:
          - leaf_info.subject.commonName == "test_zone_id_12345"
        fail_msg: Leaf certificate has unexpected properties

    - name: Check per-hostname leaf certificates exist
      ansible.builtin.stat:
        path: "/etc/cloudflare/aop/test_zone_id_12345/{{ item }}/leaf.pem"
      register: hostname_leaves
      loop:
        - app.example.com
        - api.example.com

    - name: Assert per-hostname leaf certificates exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: "Per-hostname leaf missing for {{ item.item }}"
      loop: "{{ hostname_leaves.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify per-hostname leaf CN via loop
      community.crypto.x509_certificate_info:
        path: "/etc/cloudflare/aop/test_zone_id_12345/app.example.com/leaf.pem"
      register: app_leaf

    - name: Assert app hostname leaf CN
      ansible.builtin.assert:
        that:
          - app_leaf.subject.commonName == "app.example.com"
        fail_msg: "app.example.com leaf CN mismatch"

    - name: Verify api hostname leaf CN
      community.crypto.x509_certificate_info:
        path: "/etc/cloudflare/aop/test_zone_id_12345/api.example.com/leaf.pem"
      register: api_leaf

    - name: Assert api hostname leaf CN
      ansible.builtin.assert:
        that:
          - api_leaf.subject.commonName == "api.example.com"
        fail_msg: "api.example.com leaf CN mismatch"

    - name: Note why API enable not covered in molecule
      ansible.builtin.debug:
        msg: >-
          Molecule runs with cloudflare_aop_upload_cert=false and enable=false (fake token),
          so tasks/enable_hostname.yml retry logic for pending_deployment (status:active) is not exercised here.
          Return facts (cloudflare_aop.hostnames) are set via set_fact in converge but do not persist to verify
          (separate ansible run). Manual verification was done against kisha.lucid.net.au (www.lucid.net.au).
          To cover enable in CI, stub api.cloudflare.com or run with upload/enable true against a test zone.
