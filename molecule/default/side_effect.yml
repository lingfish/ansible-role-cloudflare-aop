---
# Replace ca.pem with a valid CA certificate whose key is not present
# (e.g. copied from another host) and drop the zone leaf, so the role has
# to sign a leaf. The role should re-issue the CA instead of failing with
# "The CA private key does not belong to the CA certificate".
- name: Side effect - CA certificate without its key
  hosts: all
  vars:
    aop_cert_dir: /etc/cloudflare/aop
    aop_foreign_dir: /tmp/foreign-ca
    cloudflare_aop_zone_id: "test_zone_id_12345"
    cloudflare_aop_api_token: "test_token_abcde"
    cloudflare_aop_upload_cert: false
    cloudflare_aop_enable: false
    cloudflare_aop_cleanup_old: false
  tasks:
    - name: Create foreign CA directory
      ansible.builtin.file:
        path: "{{ aop_foreign_dir }}"
        state: directory
        mode: "0700"

    - name: Generate foreign CA key
      community.crypto.openssl_privatekey:
        path: "{{ aop_foreign_dir }}/ca.key"
        type: ECC
        curve: secp256r1

    - name: Generate foreign CA certificate
      community.crypto.x509_certificate:
        path: "{{ aop_foreign_dir }}/ca.pem"
        privatekey_path: "{{ aop_foreign_dir }}/ca.key"
        provider: selfsigned
        selfsigned_not_after: "+1800d"

    - name: Copy foreign CA certificate over ca.pem
      ansible.builtin.copy:
        src: "{{ aop_foreign_dir }}/ca.pem"
        dest: "{{ aop_cert_dir }}/ca.pem"
        remote_src: true
        mode: "0644"

    - name: Remove CA key, CSR and zone leaf
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ aop_cert_dir }}/ca.key"
        - "{{ aop_cert_dir }}/ca.csr"
        - "{{ aop_cert_dir }}/test_zone_id_12345/leaf.pem"
        - "{{ aop_cert_dir }}/test_zone_id_12345/leaf.key"
        - "{{ aop_cert_dir }}/test_zone_id_12345/leaf.csr"

    - name: Run cloudflare_aop role with a foreign CA
      ansible.builtin.include_role:
        name: lingfish.cloudflare_aop

    - name: Run cloudflare_aop role with per-hostname (both modes)
      ansible.builtin.include_role:
        name: lingfish.cloudflare_aop
      vars:
        cloudflare_aop_hostnames:
          - app.example.com
          - api.example.com
        cloudflare_aop_hostname_mode: both
