---
# Internal constants - do not override these

cloudflare_aop_api_base: "https://api.cloudflare.com/client/v4"
cloudflare_aop_cert_endpoint: "/zones/{{ cloudflare_aop_zone_id }}/origin_tls_client_auth"
cloudflare_aop_settings_endpoint: "/zones/{{ cloudflare_aop_zone_id }}/origin_tls_client_auth/settings"
cloudflare_aop_zone_endpoint: "/zones/{{ cloudflare_aop_zone_id }}"
cloudflare_aop_hostname_cert_endpoint: "/zones/{{ cloudflare_aop_zone_id }}/origin_tls_client_auth/hostnames/certificates"
cloudflare_aop_hostnames_endpoint: "/zones/{{ cloudflare_aop_zone_id }}/origin_tls_client_auth/hostnames"

# Shared CA lives at the base dir, leaf certs per-zone
cloudflare_aop_ca_cert_path: "{{ cloudflare_aop_cert_dir }}/ca.pem"
cloudflare_aop_ca_key_path: "{{ cloudflare_aop_cert_dir }}/ca.key"
cloudflare_aop_ca_csr_path: "{{ cloudflare_aop_cert_dir }}/ca.csr"

# Per-zone leaf certificate directory (uses zone name, not zone ID)
# Lazy: uses explicit cloudflare_aop_zone_name if set, otherwise API result, otherwise zone_id.
# Avoids set_fact bleed when looping over multiple zones via include_role.
cloudflare_aop_zone_cert_dir: >-
  {{ cloudflare_aop_cert_dir }}/{{ cloudflare_aop_zone_name | default(_zone_info.json.result.name | default(cloudflare_aop_zone_id)) }}

# Per-hostname subdirectories are nested under the zone dir: <zone_dir>/<hostname>
# Used as base; per-hostname leaf tasks compute {{ cloudflare_aop_zone_cert_dir }}/{{ aop_hostname }}
